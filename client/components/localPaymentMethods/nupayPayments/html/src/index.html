<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NuPay - PayPal Web SDK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/client/shared/styles.css" />
    <style>
      .payment-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #nupay-full-name,
      #nupay-email {
        max-width: 400px;
        height: 80px;
      }

      .extra-fields {
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field-label {
        font-family: Verdana, sans-serif;
        font-size: 14px;
        color: #333333;
        font-weight: 500;
      }

      .field-row {
        display: flex;
        gap: 10px;
      }

      .phone-country-code-wrapper {
        flex: 0 0 80px;
      }

      .phone-national-number-wrapper,
      .tax-id-wrapper {
        flex: 1;
      }

      .tax-id-type-wrapper {
        flex: 0 0 150px;
      }

      .field-input,
      .field-select {
        width: 100%;
        height: 48px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        padding: 0 12px;
        font-family: Verdana, sans-serif;
        font-size: 14px;
        box-sizing: border-box;
      }

      .field-input:focus,
      .field-select:focus {
        outline: none;
        border-color: #0070ba;
      }

      .field-input::placeholder {
        color: #999999;
      }

      nupay-button {
        max-width: 225px;
      }

      .message {
        padding: 15px;
        border-radius: 4px;
        margin-top: 20px;
        display: none;
        max-width: 700px;
      }

      .message.success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }

      .message.error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }

      .message.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>NuPay One-Time Payment Integration</h1>

    <div class="payment-container">
      <div id="nupay-full-name"></div>
      <div id="nupay-email"></div>

      <div id="extra-fields" class="extra-fields" hidden>
        <label class="field-label">Phone Number:</label>
        <div class="field-row">
          <div class="phone-country-code-wrapper">
            <input
              type="text"
              class="field-input"
              id="phone-country-code"
              placeholder="55"
            />
          </div>
          <div class="phone-national-number-wrapper">
            <input
              type="tel"
              class="field-input"
              id="phone-national-number"
              placeholder="Phone Number"
            />
          </div>
        </div>

        <label class="field-label">Tax Information:</label>
        <div class="field-row">
          <div class="tax-id-wrapper">
            <input
              type="text"
              class="field-input"
              id="tax-id"
              placeholder="Tax ID (CPF)"
            />
          </div>
          <div class="tax-id-type-wrapper">
            <select class="field-select" id="tax-id-type">
              <option value="">Select Type</option>
              <option value="BR_CPF">CPF</option>
            </select>
          </div>
        </div>
      </div>

      <nupay-button id="nupay-button" hidden></nupay-button>
    </div>

    <div id="message" class="message"></div>

    <script
      async
      src="https://www.sandbox.paypal.com/web-sdk/v6/core"
      onload="onPayPalWebSdkLoaded()"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
