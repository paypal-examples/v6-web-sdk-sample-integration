<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PSE - PayPal Web SDK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/client/shared/styles.css" />
    <style>
      .payment-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #pse-full-name,
      #pse-email {
        max-width: 400px;
        height: 80px;
      }

      .extra-fields {
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field-label {
        font-family: Verdana, sans-serif;
        font-size: 14px;
        color: #333333;
        font-weight: 500;
      }

      .field-row {
        display: flex;
        gap: 10px;
      }

      .field-row-narrow {
        flex: 0 0 120px;
      }

      .field-row-wide {
        flex: 1;
      }

      .field-input,
      .field-select {
        width: 100%;
        height: 48px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        padding: 0 12px;
        font-family: Verdana, sans-serif;
        font-size: 14px;
        box-sizing: border-box;
      }

      .field-input:focus,
      .field-select:focus {
        outline: none;
        border-color: #0070ba;
      }

      .field-input::placeholder {
        color: #999999;
      }

      pse-button {
        max-width: 225px;
      }

      .message {
        padding: 15px;
        border-radius: 4px;
        margin-top: 20px;
        display: none;
        max-width: 700px;
      }

      .message.success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }

      .message.error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }

      .message.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>PSE One-Time Payment Integration</h1>

    <div class="payment-container">
      <div id="pse-full-name"></div>
      <div id="pse-email"></div>

      <div id="extra-fields" class="extra-fields" hidden>
        <label class="field-label">BIC:</label>
        <input
          type="text"
          class="field-input"
          id="pse-bic"
          placeholder="1032"
        />

        <label class="field-label">Identification:</label>
        <div class="field-row">
          <div class="field-row-narrow">
            <select class="field-select" id="identification-type">
              <option value="">Select Type</option>
              <option value="CO_CCI">CCI</option>
              <option value="CO_CEX">CEX</option>
              <option value="CO_DIE">DIE</option>
              <option value="CO_NIT">NIT</option>
              <option value="CO_PAS">PAS</option>
              <option value="CO_RCN">RCN</option>
              <option value="CO_TEX">TEX</option>
              <option value="CO_TID">TID</option>
            </select>
          </div>
          <div class="field-row-wide">
            <input
              type="text"
              class="field-input"
              id="identification-number"
              placeholder="ID Number"
            />
          </div>
        </div>

        <label class="field-label">Phone Number:</label>
        <div class="field-row">
          <div class="field-row-narrow">
            <input
              type="text"
              class="field-input"
              id="phone-country-code"
              placeholder="57"
            />
          </div>
          <div class="field-row-wide">
            <input
              type="tel"
              class="field-input"
              id="phone-national-number"
              placeholder="Phone Number"
            />
          </div>
        </div>

        <label class="field-label">Billing Address:</label>
        <input
          type="text"
          class="field-input"
          id="address-line-1"
          placeholder="Address Line 1"
        />
        <input
          type="text"
          class="field-input"
          id="address-line-2"
          placeholder="Address Line 2"
        />
        <input
          type="text"
          class="field-input"
          id="admin-area-1"
          placeholder="Admin Area 1 (State)"
        />
        <input
          type="text"
          class="field-input"
          id="admin-area-2"
          placeholder="Admin Area 2 (City)"
        />
        <input
          type="text"
          class="field-input"
          id="postal-code"
          placeholder="Postal Code"
        />
        <input
          type="text"
          class="field-input"
          id="country-code"
          placeholder="Country Code (e.g., CO)"
        />
      </div>

      <pse-button id="pse-button" hidden></pse-button>
    </div>

    <div id="message" class="message"></div>

    <script
      async
      src="https://www.sandbox.paypal.com/web-sdk/v6/core"
      onload="onPayPalWebSdkLoaded()"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
